name: PHPBench PR Benchmark

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

env:
  REQUIRED_PHP_EXTENSIONS: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
  PHPBENCH_MAX_REG: ${{ vars.PHPBENCH_MAX_REG }}

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: ${{ env.REQUIRED_PHP_EXTENSIONS }}
          coverage: none

      - name: Prepare benchmark worktrees
        run: |
          set -euo pipefail

          WORKSPACE="$RUNNER_TEMP/phpbench-workspace"
          BASE_DIR="$WORKSPACE/base"
          PR_DIR="$WORKSPACE/pr"

          rm -rf "$WORKSPACE"
          mkdir -p "$WORKSPACE"

          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git worktree add "$PR_DIR" "${{ github.event.pull_request.head.sha }}"
          git worktree add "$BASE_DIR" "origin/${{ github.event.pull_request.base.ref }}"

          {
            echo "WORKSPACE=$WORKSPACE"
            echo "BASE_DIR=$BASE_DIR"
            echo "PR_DIR=$PR_DIR"
          } >> "$GITHUB_ENV"

      - name: Install dependencies (PR)
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: ${{ env.PR_DIR }}

      - name: Install dependencies (base)
        run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: ${{ env.BASE_DIR }}

      - name: Run PHPBench (PR)
        run: |
          set -euo pipefail

          ARGS=()
          CONFIG_FILE="$PWD/phpbench.ci.json"
          if [ -f "$CONFIG_FILE" ]; then
            ARGS+=(--config="$CONFIG_FILE")
          fi

          vendor/bin/phpbench run \
            --output-format=json \
            --output="$WORKSPACE/pr.json" \
            "${ARGS[@]}"
        working-directory: ${{ env.PR_DIR }}

      - name: Run PHPBench (base)
        run: |
          set -euo pipefail

          ARGS=()
          CONFIG_FILE="$PWD/phpbench.ci.json"
          if [ -f "$CONFIG_FILE" ]; then
            ARGS+=(--config="$CONFIG_FILE")
          fi

          vendor/bin/phpbench run \
            --output-format=json \
            --output="$WORKSPACE/base.json" \
            "${ARGS[@]}"
        working-directory: ${{ env.BASE_DIR }}

      - name: Compare benchmark results
        id: compare
        continue-on-error: true
        run: |
          set +e
          php tools/phpbench-compare.php "$WORKSPACE/base.json" "$WORKSPACE/pr.json" "$WORKSPACE/summary.md"
          STATUS=$?
          set -e

          {
            echo "comment<<EOF"
            if [ -f "$WORKSPACE/summary.md" ]; then
              cat "$WORKSPACE/summary.md"
            else
              echo "Benchmark comparison could not be generated."
            fi
            echo "EOF"
            echo "exit_code=$STATUS"
          } >> "$GITHUB_OUTPUT"

          exit "$STATUS"

      - name: Post benchmark comment
        if: always()
        uses: actions/github-script@v8
        env:
          COMMENT_BODY: ${{ steps.compare.outputs.comment }}
        with:
          script: |
            const marker = '<!-- phpbench-pr-benchmark -->';
            const body = `${marker}
            ## PHPBench comparison

            ${process.env.COMMENT_BODY ?? 'Benchmark comparison was not generated.'}`;

            const issue_number = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Enforce regression threshold
        if: always() && steps.compare.outputs.exit_code != '0'
        run: exit 1
